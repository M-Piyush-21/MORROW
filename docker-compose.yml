version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: morrow-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - API_V1_PREFIX=/api
      - BACKEND_CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://127.0.0.1:5173"]
      - MLFLOW_TRACKING_URI=sqlite:///mlruns.db
      - MLFLOW_EXPERIMENT_NAME=morrow_demand_forecasting
    volumes:
      - ./backend/data/processed:/app/backend/data/processed
      - ./backend/models:/app/backend/models
      - ./backend/reports:/app/backend/reports
      - ./mlruns.db:/app/mlruns.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_BASE_URL=http://localhost:8000/api
    container_name: morrow-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: morrow-mlflow
    command: ["mlflow", "ui", "--backend-store-uri", "sqlite:///mlruns.db", "--host", "0.0.0.0", "--port", "5000"]
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns.db:/app/mlruns.db
      - ./mlruns:/app/mlruns
    restart: unless-stopped
