name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-test:
    name: Backend Tests & DVC Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate DVC Pipeline Syntax
        run: |
          dvc doctor || true
          # Validate syntax of dvc.yaml and params.yaml
          python -c "import yaml; yaml.safe_load(open('dvc.yaml')); yaml.safe_load(open('params.yaml')); print('DVC config valid')"

      - name: Run Backend Pytest Suite
        run: |
          PYTHONPATH=. pytest backend/tests -v

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Vite Production Build
        run: npm run build
